# ==============================================================
# Triggers on every push and pull request.
# Stages: Lint → SCA → Build → Image Scan → IaC Scan → Deploy Manifest Update
# ==============================================================


name: Devsecops Pipeline

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

permissions:
  contents: read
  
env:
  DOCKER_REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/web-app-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/web-app-frontend

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - name : Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.component }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.component }}

      - name: Run lint
        run: npm run lint
        working-directory: ${{ matrix.component }}  
        
  sca:
    name: Software Composition Analysis
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: lint
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - name : Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.component }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.component }}

      - name: Npm Audit
        run: npm audit --audit-level=high || true
        working-directory: ${{ matrix.component }}

  Static-analysis:
    name: Static Code Analysis
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: sca
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - name : Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.component }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.component }}

      - name: Run static analysis
        run: npm run static-analysis || true
        working-directory: ${{ matrix.component }}


  Docker-build:
    name: Docker Build 
    runs-on: ubuntu-latest
    needs: Static-analysis
    permissions:
      contents: read
      packages: write # Needed to push Docker images to GitHub Container Registry
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - name : Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: extract metadata (tag and label)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/${{ matrix.component }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix

      - name: Build and push Docker image
        uses: docker/build-push-action@v3
        with:
          context: ./${{ matrix.component }}
          file: ./${{ matrix.component }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }} # Only push on non-PR events
          tags: ${{steps.meta.outputs.tags}}
          labels: ${{steps.meta.outputs.labels}}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # enable SBOM generation and provenance metadata for enhanced traceability and security insights
          provenance: true
          sbom: true

  Dockerfile-lint:
    name: Dockerfile Lint
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: Static-analysis
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v3
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.component }}/Dockerfile

  Image-scan:
    name: Image Scan
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: Docker-build
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - name : Checkout code
        uses: actions/checkout@v4

      - name: Trivy Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/${{ matrix.component }}:${{ github.sha }}
          format: table
          output: trivy-image-scan.txt
          exit-code: "0"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"
