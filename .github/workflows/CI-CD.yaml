# ==============================================================
# Triggers on every push and pull request.
# Stages: Lint → SCA → Build → Image Scan → IaC Scan → Deploy Manifest Update
# ==============================================================


name: Devsecops Pipeline

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

permissions:
  contents: read
  
env:
  DOCKER_REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/web-app-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/web-app-frontend

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - name : Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.component }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.component }}

      - name: Run lint
        run: npm run lint
        working-directory: ${{ matrix.component }}  
        
  sca:
    name: Software Composition Analysis
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: lint
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - name : Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.component }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.component }}

      - name: Npm Audit
        run: npm run sca --audit-level=high || true
        working-directory: ${{ matrix.component }}

  Static-analysis:
    name: Static Code Analysis
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: sca
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - name : Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.component }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.component }}

      - name: Run static analysis
        run: npm run static-analysis || true
        working-directory: ${{ matrix.component }}