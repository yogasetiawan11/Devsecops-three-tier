# ==============================================================
# Triggers on every push and pull request.
# Stages: Lint → SCA → Build → Image Scan → IaC Scan → Deploy Manifest Update
# ==============================================================


name: Devsecops Pipeline

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

permissions:
  contents: read
  
env:
  github.repository: Devsecops-three-tier
  DOCKER_REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/web-app-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/web-app-frontend

jobs:
###################################################################
# Step 1: Code Quality and Security Checks
###################################################################
  lint:
    name: Lint
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - name : Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "${{ matrix.component }}/**package-lock.json"

      - name: Install dependencies
        working-directory: ${{ matrix.component }}
        run: npm ci

      - name: Run lint
        working-directory: ${{ matrix.component }}  
        run: npm run lint || true

####################################################################
# Step 2: Software Composition Analysis (SCA) and Static Code Analysis
####################################################################

  sca:
    name: Software Composition Analysis
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: lint
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - name : Checkout code
        uses: actions/checkout@v4
  
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "${{ matrix.component }}/package-lock.json"

      - name: Install dependencies
        working-directory: ${{ matrix.component }}
        run: npm ci

      - name: Npm Audit
        working-directory: ${{ matrix.component }}
        run: npm audit --audit-level=high || true

####################################################################
# Step 3: Static Code Analysis
####################################################################

  static-analysis:
    name: Static Code Analysis
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: sca
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - name : Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "${{ matrix.component }}/package-lock.json"

      - name: Install dependencies
        working-directory: ${{ matrix.component }}
        run: npm ci

      - name: Run static analysis
        working-directory: ${{ matrix.component }}
        run: npm run static-analysis || true

#####################################################################
# Step 4: Build Docker Images
#####################################################################

  build-container:
    name: build and push container images
    runs-on: ubuntu-latest
    needs: static-analysis
    permissions:
      contents: read
      packages: write # Needed to push Docker images to GitHub Container Registry
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - name : Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.TOKEN }}

      - name: extract metadata (tag and label)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.component }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}


      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          file: ./${{ matrix.component }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }} 
          tags: ${{steps.meta.outputs.tags}}
          labels: ${{steps.meta.outputs.labels}}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # enable SBOM generation and provenance metadata for enhanced traceability and security insights
          provenance: true
          sbom: true

######################################################################
# Step 5: Image Scanning with Trivy
######################################################################  

  image-scan:
    name: Image Scan
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: build-container
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - name : Checkout code
        uses: actions/checkout@v4

      - name: Build image for scanning
        run: |
          docker build -t image-scanner-${{ matrix.component }}:scan ./${{ matrix.component }}

      - name: Trivy Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "image-scanner-${{ matrix.component }}:scan"
          format: table
          output: trivy-image-scan.txt
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
          timeout: "10m"

######################################################################
# Step 6: Dockerfile Linting with Hadolint
######################################################################

  dockerfile-lint:
    name: Dockerfile Lint
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: image-scan
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - name : Checkout code
        uses: actions/checkout@v4

      - name: Run hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.component }}/Dockerfile
          failure-threshold: warning
   
######################################################################
# Step 7: IaC Scanning with Checkov
######################################################################

  iac-scan:
    name: IaC Scan
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: dockerfile-lint
    steps:
      - name : Checkout code
        uses: actions/checkout@v4

      - name: chekov IaC Scanner
        uses: bridgecrewio/checkov-action@12
        with:
          directory: terraform/
          framework: terraform
          soft-fail: true
          skip-check: CKV_AWS_39,CKV_AWS_58
          output-format: cli
          output-file-path: terraform/security-reports/

      - name: Run checkov in Kubernetes
        uses: bridgecrewio/checkov-action@12
        with:
          directory: manifest/
          framework: kubernetes
          soft-fail: true
          output-format: cli
          output-file-path: k8s/security-reports/

#######################################################################
# Step 8: Deploy to Kubernetes Cluster (ArgoCD)
#######################################################################

  Deploy-to-kubernetes:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: iac-scan
    if: github.event_name == 'push' # Only deploy on push events, not on pull requests
    permissions:
      contents: write # Needed to push manifest updates to the repo
    steps:
      - name : Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN }}

      - name: get short SHA for image tag
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Update Kubernetes manifests with new image tags
        run: |
          IMAGE_TAG=${{ steps.sha.outputs.short }}


          # Find the line number of the backend container image
          # (the image: line right after `- name: backend`)
          BACKEND_LINE=$(awk '/- name: backend/{found=1} found && /image:/{print NR; exit}' manifest/kubernetes.yaml)
          echo "Backend image at line: ${BACKEND_LINE}"
          sed -i "${BACKEND_LINE}s|.*|          image: ${BACKEND_IMAGE}:${IMAGE_TAG}|" manifest/kubernetes.yaml

          # Find the line number of the frontend container image
          # (the image: line right after `- name: frontend`)
          FRONTEND_LINE=$(awk '/- name: frontend/{found=1} found && /image:/{print NR; exit}' manifest/kubernetes.yaml)
          echo "Frontend image at line: ${FRONTEND_LINE}"
          sed -i "${FRONTEND_LINE}s|.*|          image: ${FRONTEND_IMAGE}:${IMAGE_TAG}|" manifest/kubernetes.yaml

          echo "✅ Updated images to tag: ${IMAGE_TAG}"
          grep -n "image:" manifest/kubernetes.yaml

      - name: Commit and push manifest update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest/kubernetes.yaml
          git diff --cached --quiet || git commit -m "ci: update k8s images to ${{ steps.sha.outputs.short }} [skip ci]"
          git push