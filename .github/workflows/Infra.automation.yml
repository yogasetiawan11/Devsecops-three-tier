# ==============================================================
# Pipelines: Infra Automation
# This workflow automates the provisioning of infrastructure components in terraform file
# ==============================================================

name: Infra Automation

on :
  push:
    branches: 
      - main
      - staging
      - dev
    paths:
      - 'terraform/**'
  pull_request:
    branches:
      - main
      - staging
      - dev 
    paths:
      - 'terraform/**'

permissions:
  contents: read
  pull-requests: write
  issues: write


env:
  TF_LOG: INFO
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

jobs:
    terraform-plan:
      name: Terraform Plan
      runs-on: ubuntu-latest
      outputs:
        terraform-workspace: ${{ steps.env-vars.outputs.tf-workspace }}
      defaults:
        run:
          shell: bash
          working-directory: /terraform/**

      steps:
       - name: Checkout code
         uses: actions/checkout@v4
      
       - name: set up Terraform
         uses: hashicorp/setup-terraform@v3
         with:
           tflint_version: v0.52.0

       - name: Init tf lint
         uses: terraform-linters/terraform-linters-action@v3
         with:
           terraform_version: 1.5.0

    linting-file:
        name: Terraform Linting file
        runs-on: ubuntu-latest
        strategy:
            matrix:
                component: [terraform]
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install Terraform
              uses: hashicorp/setup-terraform@v1
              with:
                terraform_version: 1.5.0

            - name: Terraform fmt
              run: terraform fmt -check

            
